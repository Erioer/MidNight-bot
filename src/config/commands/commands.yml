# ============================================================
# MidNight Command Policy
# ============================================================
# Controls every command in the bot from one file.
# Settings cascade:  defaults  ->  category  ->  command
# Only list what you want to change. Everything defaults to on.
#
# Key meanings:
#   enabled   – Whether the command/category loads at all.
#               false removes it from slash, prefix, and the
#               /commands dashboard entirely.
#   slash     – Register as a slash command.
#   prefix    – Usable via the text prefix (e.g. $help).
#   adminOnly – Require the Manage Server permission.
#
# For commands that are structurally prefix-only (e.g. starboard,
# dogfact, fact, react) the slash key is ignored.
# For commands that are structurally slash-only (e.g. help,
# configwizard, play, queue, greet, wipedata) the prefix key is
# ignored.
#
# Restart the bot to apply changes. Slash-registration changes
# can take up to an hour to show on Discord's side.
#
# To restore all settings to their defaults, set the flag below
# to true and restart. It will automatically reset itself after.
# ============================================================

restoreDefaults: false

# ============================================================
# Default values for every command in the bot.
# These apply unless overridden by a category or command entry.
# ============================================================
defaults:
  enabled: true
  slash: true
  prefix: true
  adminOnly: false

# ============================================================
# Category-level overrides.
# Category keys match the folder names under src/commands
# (case-insensitive, spaces become underscores).
#
# enabled: false  → disables ALL commands in that category
#                   regardless of individual command settings.
# enabled: true   → allows individual commands to be toggled
#                   independently (the default).
#
# The other three keys (slash, prefix, adminOnly) act as the
# per-category default and CAN be overridden per-command.
# ============================================================
