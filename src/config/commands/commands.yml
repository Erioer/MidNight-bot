# ============================================================
# Individual command overrides.
# Command names are lowercase, matching the file/slash name.
# Subcommands cannot be toggled individually; toggling the
# parent command affects all its subcommands.
#
# Remove the # and set any key to override the category/default
# value.  Only list keys you want to change.
#
# adminOnly    = require Manage Server permission
# slash        = register as a slash command
# prefix       = usable via text prefix
# enabled      = load the command at all
#
# (Structurally prefix-only commands ignore slash.
#  Structurally slash-only commands ignore prefix.)
# ============================================================
